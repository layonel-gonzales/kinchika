<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Kinchika — Club de Buceo y Apnea · Lo Prado</title>
<meta name="description" content="Club de buceo y apnea sin fines de lucro de Lo Prado, Chile."/>

<link rel="stylesheet" href="styles.css"/>
<link rel="stylesheet" href="styles-sections.css"/>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>

<!-- Atmospheric layers -->
<div id="deep-bg"></div>
<div id="caustics"></div>
<canvas id="water-particles-canvas"></canvas>
<canvas id="bubbles-canvas"></canvas>
<div id="vignette"></div>
<div id="progress-bar"></div>

<!-- React mount points -->
<div id="overlay-root"></div>
<div id="nav-root"></div>
<div id="hud-root"></div>
<div id="app-root"></div>

<!-- Data -->
<script src="data.js"></script>

<!-- Components -->
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="components-top.jsx"></script>
<script type="text/babel" src="components-bottom.jsx"></script>

<!-- App entry -->
<script type="text/babel">
const TWEAKS = /*EDITMODE-BEGIN*/{
  "heroVariant": "video"
}/*EDITMODE-END*/;

function App() {
  const [overlayDone, setOverlayDone] = React.useState(false);
  const [tweaks, setTweak] = useTweaks(TWEAKS);

  return (
    <>
      {!overlayDone && <AudioOverlay onContinue={() => setOverlayDone(true)} />}
      <TopNav />
      <HUD />
      <SoundBtn />
      <Hero heroVariant={tweaks.heroVariant} />
      <EditorialDivider />
      <Mission />
      <History />
      <Timeline />
      <Schedule />
      <Events />
      <Results />
      <Directiva />
      <Location />
      <Contact />
      <Footer />

      <TweaksPanel title="Kinchika · Tweaks">
        <TweakSection title="Hero · variante">
          <TweakRadio
            value={tweaks.heroVariant}
            onChange={(v) => setTweak('heroVariant', v)}
            options={[
              { value: 'video', label: 'Video' },
              { value: 'caustics', label: 'Caustics' },
              { value: 'type', label: 'Type-driven' }
            ]}
          />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App />);
</script>

<script src="bubbles.js"></script>
<script src="water-particles.js"></script>
</body>
</html>
